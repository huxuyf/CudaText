name: Build macOS CudaText

# Builds CudaText from THIS repository (the fork), not from an upstream release.
# CudaText_up is only used as a helper for cudaup.sh (dependency download and
# lazbuild invocation) and is pinned to a commit. Publishing (tags/releases) is
# not done here: the DMG is only uploaded as a workflow artifact.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref of this repository to build (empty = ref which triggered the run)"
        required: false
        default: ""

jobs:
  build:
    name: Build for ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: Intel
            fpc_cpu: x86_64
            dmg_cpu: amd64
            fpclazup_bin: fpclazup-x86_64-darwin
            deployment_target: "10.13"
          - runner: macos-15
            arch: Apple-Silicon
            fpc_cpu: aarch64
            dmg_cpu: aarch64
            fpclazup_bin: fpclazup-aarch64-darwin
            deployment_target: "11.0"

    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
      # Pinned helper repo: cudaup.sh / cudaup.repos change rarely, but a moving
      # master would silently change how dependencies are fetched.
      CUDATEXT_UP_COMMIT: 977c102652f5552f7915e6d5ad152befcc4b6c7d
      # Pinned fpclazup release (v.2.4.0k has both darwin assets).
      FPCLAZUP_TAG: v.2.4.0k

    steps:
      # ── 1. Clone the build helper scripts at a pinned commit ─────────────
      - name: Clone CudaText_up at pinned commit
        run: |
          set -euo pipefail
          git clone https://github.com/Alexey-T/CudaText_up
          git -C CudaText_up checkout --detach "$CUDATEXT_UP_COMMIT"
          git -C CudaText_up rev-parse HEAD

      # ── 2. Download the CudaText dependencies ────────────────────────────
      - name: Download CudaText dependencies
        working-directory: CudaText_up
        run: ./cudaup.sh -g

      # ── 3. Checkout this repository (the source which is really built) ────
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          path: repo_src
          fetch-depth: 1

      # ── 4. Put this repository in place of the upstream CudaText source ──
      - name: Install this repository as CudaText source
        run: |
          set -euo pipefail
          rm -rf CudaText_up/src/CudaText
          mv repo_src CudaText_up/src/CudaText
          test -f CudaText_up/src/CudaText/app/cudatext.lpi

      # ── 5. Version: consistency gate + value used in artifact names ───────
      - name: Read and verify CudaText version
        id: version
        working-directory: CudaText_up/src/CudaText
        run: |
          set -euo pipefail
          # fails if cuda_ver.sh and proc_msg.pas/.lpi/Info.plist/changelog disagree
          sh setup/sync_version.sh --check
          VER=$(grep -oE "cAppExeVersion[[:space:]]*=[[:space:]]*'[^']+'" app/proc_msg.pas \
                | grep -oE "[0-9]+(\.[0-9]+)+" | head -1)
          echo "cudatext_version=$VER" >> "$GITHUB_OUTPUT"
          echo "CudaText version: $VER"

      # ── 6. Install FPC + Lazarus via fpclazup ─────────────────────────────
      - name: Install FPC and Lazarus
        run: |
          set -euo pipefail

          FPCLAZUP_URL="https://github.com/LongDirtyAnimAlf/Reiniero-fpcup/releases/download/${FPCLAZUP_TAG}/${{ matrix.fpclazup_bin }}"
          echo "Downloading fpclazup from: $FPCLAZUP_URL"

          curl -fSL "$FPCLAZUP_URL" -o fpclazup
          chmod +x fpclazup
          xattr -cr fpclazup

          mkdir -p "$HOME/fpc"

          # fpclazup can only install from branches (no commit/tag), so FPC and
          # Lazarus stay on moving branches. FPC is kept on fixes_3_2 because
          # FPC 'main' fails to compile fcl-svg on macOS (unused by CudaText).
          ./fpclazup \
            --fpcURL="https://gitlab.com/freepascal.org/fpc/source.git" \
            --fpcBranch=fixes_3_2 \
            --lazURL="https://gitlab.com/freepascal.org/lazarus/lazarus.git" \
            --lazBranch=main \
            --installdir="$HOME/fpc" \
            --skip=lhelp,helpfpc,helplazarus,lazdatadesktop \
            --noconfirm \
            --verbose

          echo "── Checking lazbuild ──"
          "$HOME/fpc/lazarus/lazbuild" --version

          echo "── Checking fpc ──"
          FPC_BIN=$(find "$HOME/fpc/fpc/bin" -name "fpc" -type f | head -1)
          echo "FPC binary: $FPC_BIN"
          "$FPC_BIN" -iV

      # ── 7. Add FPC and Lazarus to PATH ────────────────────────────────────
      - name: Configure PATH
        run: |
          echo "$HOME/fpc/lazarus" >> "$GITHUB_PATH"
          FPC_BIN_DIR=$(dirname "$(find "$HOME/fpc/fpc/bin" -name "fpc" -type f | head -1)")
          echo "$FPC_BIN_DIR" >> "$GITHUB_PATH"
          echo "Added to PATH: $FPC_BIN_DIR"

      # ── 8. Compile for macOS (Cocoa widgetset) ────────────────────────────
      - name: Compile CudaText
        working-directory: CudaText_up
        run: |
          ./cudaup.sh -m \
            -l "$HOME/fpc/lazarus" \
            -o darwin \
            -c ${{ matrix.fpc_cpu }} \
            -w cocoa

      # ── 9. Install compiled binary into the .app bundle ───────────────────
      - name: Install compiled binary into .app bundle
        run: |
          set -euo pipefail

          COMPILED="CudaText_up/bin/darwin-${{ matrix.fpc_cpu }}-cocoa/cudatext"
          APP_MACOS="CudaText_up/src/CudaText/app/cudatext.app/Contents/MacOS"
          APP_BIN="$APP_MACOS/cudatext"

          # Fallback search if the expected output path is absent
          if [ ! -f "$COMPILED" ]; then
            echo "Binary not at expected path, searching under CudaText_up/bin/ ..."
            COMPILED=$(find CudaText_up/bin -name "cudatext" -type f 2>/dev/null | head -1 || true)
          fi

          if [ -z "$COMPILED" ] || [ ! -f "$COMPILED" ]; then
            echo "::error::Compiled binary not found anywhere under CudaText_up/bin/"
            find CudaText_up -name "cudatext" 2>/dev/null || true
            exit 1
          fi

          COMPILED_SIZE=$(stat -f%z "$COMPILED")
          echo "Compiled binary: $COMPILED ($COMPILED_SIZE bytes)"

          if [ "$COMPILED_SIZE" -lt 1000000 ]; then
            echo "::error::Compiled binary is suspiciously small ($COMPILED_SIZE bytes)"
            exit 1
          fi

          mkdir -p "$APP_MACOS"

          # Remove symlink (or any existing file) before copying so that cp
          # places a real regular file at this path instead of following the link.
          rm -f "$APP_BIN"
          cp "$COMPILED" "$APP_BIN"
          chmod +x "$APP_BIN"

          INSTALLED_SIZE=$(stat -f%z "$APP_BIN")
          echo "Installed binary: $APP_BIN ($INSTALLED_SIZE bytes)"
          file "$APP_BIN"

          # Sanity check: fail loudly if it is still a symlink
          if [ -L "$APP_BIN" ]; then
            echo "::error::$APP_BIN is still a symlink after copy — something went wrong"
            exit 1
          fi

      # ── 10. Finalise .app bundle ──────────────────────────────────────────
      - name: Finalise CudaText.app bundle
        run: |
          SRC="CudaText_up/src/CudaText/app"
          APP="$SRC/cudatext.app"
          FINAL_APP="$SRC/CudaText.app"

          mv "$APP" "$FINAL_APP"

          echo "── Info.plist ──"
          cat "$FINAL_APP/Contents/Info.plist" || echo "::warning::Info.plist not found!"

          echo "── Resources contents ──"
          ls "$FINAL_APP/Contents/Resources/" | head -20

          echo "── MacOS binary ──"
          ls -lh "$FINAL_APP/Contents/MacOS/"

          echo "── Total size ──"
          du -sh "$FINAL_APP"

      # ── 11. Write arch-specific readme.txt ────────────────────────────────
      # Each architecture gets a completely different readme.txt
      - name: Write arch-specific readme.txt
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.cudatext_version }}"
          README_DEST="/tmp/cudatext_readme.txt"

          if [ "${{ matrix.dmg_cpu }}" = "aarch64" ]; then
            # ── Apple Silicon readme ──────────────────────────────────────
            printf 'CudaText %s\nhttps://cudatext.github.io\n\nINSTRUCTIONS:\n\n1. Drag CudaText.app to your Applications folder to install.\n2. Open the terminal and type the following command: xattr -cr /Applications/CudaText.app\n\nDocumentation: https://wiki.freepascal.org/CudaText\n' \
              "$VER" > "$README_DEST"
            echo "Written Apple Silicon readme.txt"
          else
            # ── Intel readme ──────────────────────────────────────────────
            printf 'CudaText %s\nhttps://cudatext.github.io\n\nINSTRUCTIONS:\n\n- Drag CudaText.app to your Applications folder to install.\n\nDocumentation: https://wiki.freepascal.org/CudaText\n' \
              "$VER" > "$README_DEST"
            echo "Written Intel readme.txt"
          fi

          echo "── readme.txt contents ──"
          cat "$README_DEST"

      # ── 12. Create DMG disk image ─────────────────────────────────────────
      # Volume name and filename match the official release convention:
      #   volume  : cudatext-mac-cocoa
      #   filename: cudatext-macos-cocoa-{cpu}-{version}.dmg
      - name: Create DMG
        run: |
          SRC="CudaText_up/src/CudaText/app"
          VER="${{ steps.version.outputs.cudatext_version }}"
          DMG_NAME="cudatext-macos-cocoa-${{ matrix.dmg_cpu }}-${VER}.dmg"

          DMG_STAGE=$(mktemp -d)
          cp -R "$SRC/CudaText.app" "$DMG_STAGE/"

          # Applications symlink for drag-to-install
          ln -s /Applications "$DMG_STAGE/Applications"

          # readme.txt — always present after step 11
          if [ -f "/tmp/cudatext_readme.txt" ]; then
            cp "/tmp/cudatext_readme.txt" "$DMG_STAGE/readme.txt"
            echo "Added readme.txt to DMG"
          else
            echo "::warning::readme.txt missing from /tmp — DMG will be created without it"
          fi

          hdiutil create \
            -volname "cudatext-mac-cocoa-${{ matrix.dmg_cpu }}-${VER}" \
            -srcfolder "$DMG_STAGE" \
            -ov \
            -format UDZO \
            "$DMG_NAME"

          rm -rf "$DMG_STAGE"
          echo "Created: $DMG_NAME"
          ls -lh "$DMG_NAME"

      # ── 13. Upload the DMG ────────────────────────────────────────────────
      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: cudatext-macos-cocoa-${{ matrix.dmg_cpu }}-${{ steps.version.outputs.cudatext_version }}
          path: cudatext-macos-cocoa-${{ matrix.dmg_cpu }}-${{ steps.version.outputs.cudatext_version }}.dmg
          retention-days: 30
          if-no-files-found: error
